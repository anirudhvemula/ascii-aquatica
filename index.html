<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Shark ASCII Aquarium — v12</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root{
  --bg:#020a0b;
  --teal:#39e0c7;
  --muted:#6a918c;
  --line:rgba(57,224,199,.28);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--teal)}
#view{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{
  position:fixed;z-index:5;top:14px;left:14px;
  display:flex;align-items:center;gap:8px;
  user-select:none;
}
button{
  appearance:none;border:1px solid var(--line);background:rgba(2,18,18,.76);
  color:var(--teal);font:13px "Share Tech Mono",monospace;
  letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;
  cursor:pointer;backdrop-filter:blur(5px);
}
button:hover{background:rgba(12,39,37,.88)}
button:active{transform:translateY(1px)}
#hint{display:none}
#file{display:none}
@media(max-width:700px){
  #ui{top:9px;left:9px}
  button{font-size:11px;padding:7px 9px}
}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <button id="load">♪ Load Audio</button>
  <button id="play">▶ Play</button>
  <button id="full">⛶</button>
  <input id="file" type="file" accept="audio/*">
</div>
<div id="hint"></div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fileInput = document.getElementById("file");
const playBtn = document.getElementById("play");
const hint = document.getElementById("hint");

let W=0,H=0,dpr=1,BASE=16,CHARW=10,LINEH=19;
let t=0,last=performance.now();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

// Centre-of-sprite helpers. Everything measures from centres now — comparing
// top-left corners of differently sized sprites biased every chase.
const cx=e=>e.x+(e.w||0)*.5;
const cy=e=>e.y+(e.h||0)*.5;
const distC=(a,b)=>Math.hypot(cx(a)-cx(b),cy(a)-cy(b));

const palette={
  baby:"#ffe14a", adult:"#43c8ff", pink:"#ff6fae",
  orange:"#ff9b4a", green:"#55df8a",
  fish:"#68d8d0", fish2:"#8ad7ff",
  bubble:"rgba(78,225,207,.42)",
  weed:"rgba(45,154,128,.48)",
  plankton:"rgba(83,165,157,.18)"
};

/* -------------------------------------------------------------------------
   Water column. Every swimmer is confined to this band, and to the canvas.
------------------------------------------------------------------------- */
const TOP   = ()=>H*.10;
const BOTTOM= ()=>H*.885;
const SIDE  = 8;

// Fish population scales with the size of the tank, so a wider window is
// actually fuller rather than the same fish spread thinner.
const fishTarget=()=>Math.round(clamp(W*H/72000,14,32));

function syncFishCount(){
  const want=fishTarget();
  while(fishes.length>want){
    // Drop any shark that was hunting the fish we just removed, or it chases
    // a target that is no longer in the tank.
    const gone=fishes.pop();
    for(const s of sharks) if(s.target===gone){ s.target=null; s.state="cruise"; s.stateT=2; }
  }
  while(fishes.length<want) fishes.push(spawnFish(fishes.length));
}

let prevW=0,prevH=0;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  BASE=clamp(Math.min(W/105,H/42),11,21);
  ctx.font=`${BASE}px "Share Tech Mono",monospace`;
  CHARW=ctx.measureText("M").width;
  LINEH=BASE*1.18;

  // Remap every position proportionally so the population spreads into the
  // new canvas immediately. Clamping alone left the newly revealed area empty
  // until creatures happened to wander into it.
  const sx=prevW?W/prevW:1, sy=prevH?H/prevH:1;
  for(const e of [...fishes,...sharks,...creatures]){
    const ccx=cx(e)*sx, ccy=cy(e)*sy;
    measure(e);
    e.x=ccx-e.w*.5; e.y=ccy-e.h*.5;
    confine(e);
  }
  for(const p of particles){ p.x=clamp(p.x*sx,0,W); p.y=clamp(p.y*sy,H*.06,H*.92); }
  for(const b of bubbles){ b.x=clamp(b.x*sx,2,W-2); b.y*=sy; }
  for(let i=0;i<weeds.length;i++) weeds[i].x=W*(i+.5)/weeds.length+weeds[i].jitter;

  syncFishCount();
  prevW=W; prevH=H;
}

/* -------------------------------------------------------------------------
   Audio: optional local file + a tiny built-in rhythm loop.
------------------------------------------------------------------------- */
const audio={
  ctx:null, gain:null, analyser:null, source:null, buffer:null, bins:null,
  mode:"synth", playing:false, startedAt:0, offset:0,
  init(){
    if(this.ctx) return;
    this.ctx=new AudioContext();
    this.gain=this.ctx.createGain();
    this.gain.gain.value=.72;
    this.analyser=this.ctx.createAnalyser();
    this.analyser.fftSize=512;
    this.bins=new Uint8Array(this.analyser.frequencyBinCount);
    this.gain.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
  },
  buildSynth(){
    const sr=this.ctx.sampleRate, bpm=112, beat=60/bpm, bars=8;
    const len=Math.ceil(bars*4*beat*sr);
    const b=this.ctx.createBuffer(2,len,sr), A=b.getChannelData(0),B=b.getChannelData(1);
    const tone=(start,midi,dur,amp)=>{
      const n=Math.floor(dur*sr), s=Math.floor(start*sr), f=440*Math.pow(2,(midi-69)/12);
      let ph=0;
      for(let i=0;i<n && s+i<len;i++){
        const tt=i/sr, env=Math.min(1,tt*120)*Math.exp(-tt*3.2);
        ph+=f/sr;
        const p=ph%1, wave=p<.5?1:-1;
        const v=wave*env*amp;
        A[s+i]+=v; B[s+i]+=v*.86;
      }
    };
    const kick=(start,amp)=>{
      const n=Math.floor(.24*sr),s=Math.floor(start*sr); let ph=0;
      for(let i=0;i<n&&s+i<len;i++){
        const tt=i/sr;
        ph+=(55+105*Math.exp(-tt*28))/sr;
        const v=Math.sin(ph*6.283)*Math.exp(-tt*10)*amp;
        A[s+i]+=v;B[s+i]+=v;
      }
    };
    const bass=[36,36,33,33,29,29,31,31];
    for(let bar=0;bar<bars;bar++){
      const base=bar*4*beat;
      for(let q=0;q<4;q++) kick(base+q*beat,q===3?.28:.22);
      for(let q=0;q<4;q++) tone(base+q*beat,bass[bar],.28,.075);
      tone(base+.5*beat,60,.16,.035);
      tone(base+1.5*beat,64,.16,.035);
      tone(base+2.5*beat,67,.16,.035);
      tone(base+3.5*beat,64,.16,.035);
    }
    this.buffer=b;
  },
  startSource(){
    this.stopSource();
    if(this.mode==="synth" && !this.buffer) this.buildSynth();
    if(!this.buffer) return;
    const src=this.ctx.createBufferSource();
    src.buffer=this.buffer;
    src.loop=this.mode==="synth";
    src.connect(this.gain);
    src.onended=()=>{ if(this.playing && this.mode==="file"){this.playing=false; syncPlay()} };
    this.source=src;
    this.startedAt=this.ctx.currentTime;
    src.start(0,this.offset%(src.buffer.duration||1));
  },
  stopSource(){
    if(this.source){try{this.source.stop()}catch(e){} this.source.disconnect();this.source=null}
  },
  play(){
    this.init();
    if(this.ctx.state==="suspended") this.ctx.resume();
    this.playing=true;
    this.startSource();
    syncPlay();
  },
  pause(){
    if(!this.ctx)return;
    this.offset=(this.ctx.currentTime-this.startedAt+this.offset)%(this.buffer?.duration||1);
    this.playing=false; this.stopSource(); syncPlay();
  },
  time(){
    if(!this.playing||!this.ctx||!this.source?.buffer)return this.offset;
    return (this.ctx.currentTime-this.startedAt+this.offset)%this.source.buffer.duration;
  }
};

let audioLevel=0,beatPulse=0,lastBeat=-1,beatIndex=0;
function analyseAudio(){
  if(!audio.playing||!audio.analyser){audioLevel*=.94;return}
  audio.analyser.getByteFrequencyData(audio.bins);
  let sum=0; for(let i=0;i<28;i++)sum+=audio.bins[i];
  audioLevel=lerp(audioLevel,sum/(28*255),.22);

  const period=60/112;
  const currentBeat=Math.floor(audio.time()/period);
  if(currentBeat!==lastBeat){ lastBeat=currentBeat; beatIndex++; beatPulse=1; }
}
function syncPlay(){
  playBtn.textContent=audio.playing?"❚❚ Pause":"▶ Play";
  hint.style.opacity=audio.playing?"0":"1";
}
document.getElementById("play").onclick=()=>audio.playing?audio.pause():audio.play();
document.getElementById("load").onclick=()=>fileInput.click();
fileInput.onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  audio.init();
  try{
    audio.buffer=await audio.ctx.decodeAudioData(await f.arrayBuffer());
    audio.mode="file";audio.offset=0;audio.playing=false;audio.stopSource();
    audio.play();
  }catch(err){}
};
document.getElementById("full").onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

/* -------------------------------------------------------------------------
   ASCII renderer
------------------------------------------------------------------------- */
const MIRROR={"<":">",">":"<","/":"\\","\\":"/","(":")",")":"(","[":"]","]":"[","{":"}","}":"{","b":"d","d":"b","p":"q","q":"p"};
function mirror(lines){
  const w=Math.max(...lines.map(s=>s.length));
  return lines.map(s=>s.padEnd(w," ").split("").reverse().map(c=>MIRROR[c]||c).join(""));
}
const SHARK_RIGHT = ["><((((°>"];
const SHARK_LEFT  = mirror(SHARK_RIGHT);
const SHARK_FIN = "🢑";

const FISH=["><>","><(°>","><((°>","><(((°>"];
const FISH_MIRRORED = FISH.map(f=>mirror([f])[0]);

function drawTextSprite(x,y,lines,color,alpha=1,scale=1){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.font=`${Math.round(BASE*scale)}px "Share Tech Mono",monospace`;
  ctx.textBaseline="top";
  const lh=BASE*scale*1.18;
  for(let r=0;r<lines.length;r++)ctx.fillText(lines[r],x,y+r*lh);
  ctx.restore();
}

/* -------------------------------------------------------------------------
   World
------------------------------------------------------------------------- */
const CREATURE_ART = {
  crab:     ["  \\_/ "," (o o)","/|_|\\"],
  jelly:    [" .---. ","( o o )"," \\|/\\|/ "],
  turtle:   ["  ____ "," /o  o\\","<  __  >","  /  \\ "],
  seahorse: ["  _"," / )","((  )"," \\_)"],
  starfish: ["  \\|/ ","-- * --","  /|\\ "],
  ray:      ["  \\_//  ","<( o o )>"]
};

const CREATURE_COLORS = {
  crab:"#ff766f", jelly:"#c486ff", turtle:"#55d99b",
  seahorse:"#ffb15c", starfish:"#ffcf5a", ray:"#69bfff"
};

// Per-species pacing. cruise/lounge are duration ranges in seconds; speed is
// the cruise speed in px/s. Everything here is deliberately slow — the fastest
// creature (the ray) still glides at walking-pace-for-an-ant.
const CREATURE_BEHAVIOR = {
  crab:     {cruise:[1.5,4.0], lounge:[3.5,9],  speed:[5,11],  vy:.15, floor:true},
  starfish: {cruise:[2.0,5.0], lounge:[7,16],   speed:[2,5],   vy:.10, floor:true},
  jelly:    {cruise:[2.0,5.0], lounge:[3,8],    speed:[4,9],   vy:.85},
  turtle:   {cruise:[5.0,11],  lounge:[3,7],    speed:[7,13],  vy:.35},
  seahorse: {cruise:[1.5,4.0], lounge:[5,12],   speed:[3,7],   vy:.70},
  ray:      {cruise:[6.0,14],  lounge:[2,5],    speed:[8,15],  vy:.30}
};

const fishes=[],sharks=[],creatures=[],bubbles=[],particles=[],weeds=[];

// A slow, shared water current. Gives lounging creatures a reason to drift
// instead of freezing in place.
const current={x:0,y:0};

function measure(e){
  const lines=e.artLines||[e.art||""];
  const cols=Math.max(...lines.map(s=>s.length));
  e.w=cols*CHARW*(e.scale||e.size||1);
  e.h=lines.length*BASE*(e.scale||e.size||1)*1.18;
}

// The hard guarantee that nothing is ever drawn outside the canvas.
function confine(e){
  e.x=clamp(e.x,SIDE,Math.max(SIDE,W-e.w-SIDE));
  const lo=e.floor?BOTTOM()-H*.10:TOP();
  const hi=e.floor?BOTTOM():BOTTOM()-e.h;
  e.y=clamp(e.y,Math.min(lo,hi),Math.max(lo,hi));
}

/* ---- Fish ---------------------------------------------------------------- */
function spawnFish(i){
  const f={
    art:pick(FISH), artIndex:0,
    x:0,y:0, vx:0,vy:0, face:Math.random()<.5?1:-1,
    phase:rnd(0,Math.PI*2), seed:rnd(0,100),
    size:pick([.72,.8,.88,1]),
    color:pick([palette.fish,palette.fish2]),
    fear:0, state:"lounge", stateT:rnd(1,6),
    heading:rnd(-Math.PI,Math.PI),
    speed:rnd(12,22), fleeSpeed:rnd(44,58),
    // Hunt legibility
    alert:0,      // "!!!" above the fish the moment a shark locks on
    dash:0,       // brief extra burst of speed at the start of a flee
    jukeT:0,      // evasive sideways dodge in progress
    jukeAngle:0,
    jukeCd:0,
    trail:[],     // short ASCII motion trail while bolting
    hist:[]       // recent positions, so a pursuing shark can aim at where
                  // the fish *was* and overshoot when it jukes
  };
  f.artIndex=FISH.indexOf(f.art);
  measure(f);
  const lane=i%4;
  f.x=rnd(W*.08,W*.88);
  f.y=H*(.20+lane*.15)+rnd(-H*.04,H*.04);
  confine(f);
  return f;
}

function updateFish(f,dt){
  f.phase+=dt*(.45+Math.hypot(f.vx,f.vy)*.008);
  f.fear=Math.max(0,f.fear-dt*.8);
  f.stateT-=dt;
  f.alert=Math.max(0,f.alert-dt);
  f.dash=Math.max(0,f.dash-dt);

  // Position history (~0.6s) — a hunting shark aims at an older entry.
  f.hist.push({x:cx(f),y:cy(f),t});
  while(f.hist.length&&t-f.hist[0].t>.6) f.hist.shift();

  // Motion trail only while genuinely bolting.
  if(f.state==="flee"&&Math.hypot(f.vx,f.vy)>34){
    f.trail.push({x:cx(f)-f.face*f.w*.7,y:cy(f)});
    if(f.trail.length>5) f.trail.shift();
  }else if(f.trail.length&&Math.random()<dt*22) f.trail.shift();

  // A shark only frightens this fish if it is actually hunting *it*, or if it
  // has come right alongside. Fleeing every shark in the tank meant no fish
  // ever stopped panicking.
  let threat=null,threatD=Infinity;
  for(const s of sharks){
    const d=distC(f,s);
    // Being hunted is terrifying from a long way off; a hunting shark chasing
    // someone else is worth dodging; a resting shark you can share water with.
    const range=s.state!=="hunt"?45:(s.target===f?320:70);
    if(d<range&&d<threatD){threatD=d;threat=s}
  }
  f.jukeT=Math.max(0,f.jukeT-dt);
  f.jukeCd=Math.max(0,f.jukeCd-dt);

  // Evasive dodge: when the shark hunting this fish closes in, cut hard
  // sideways. This is what the shark's capped turn rate cannot follow, so the
  // charge sails past — the overshoot the viewer actually sees.
  if(f.jukeCd<=0&&threat&&threat.state==="hunt"&&threat.target===f&&threatD<118){
    const away=Math.atan2(cy(f)-cy(threat),cx(f)-cx(threat));
    f.jukeAngle=away+(Math.random()<.5?-1:1)*rnd(.95,1.55);
    f.jukeT=.8; f.jukeCd=rnd(.65,1.05); f.dash=.65; f.alert=.4;
    const sp=f.fleeSpeed*1.35;
    f.vx=Math.cos(f.jukeAngle)*sp;
    f.vy=Math.sin(f.jukeAngle)*sp*.6;
    addBubble(cx(f),cy(f),2);
  }

  if(threat){
    f.state="flee";
    f.stateT=Math.max(f.stateT,rnd(.7,1.3));
    f.fear=1;
  }else if(f.stateT<=0){
    if(f.state==="cruise"){
      f.state="lounge"; f.stateT=rnd(2.5,7.5);
    }else{
      f.state="cruise"; f.stateT=rnd(3,9);
      f.heading=rnd(-Math.PI,Math.PI);
      f.speed=rnd(12,22);
    }
  }

  // ---- desired velocity, by state ----
  let dvx=current.x,dvy=current.y;
  if(f.state==="flee"&&threat){
    const dx=cx(f)-cx(threat),dy=cy(f)-cy(threat),d=Math.hypot(dx,dy)||1;
    // Flee on a slight angle rather than straight down the shark's line —
    // that sideways component is what makes the shark overshoot.
    const sp=f.fleeSpeed*(f.dash>0?1.3:1);
    // A juke in progress overrides "straight away from the shark" and holds
    // the new heading long enough for the shark to commit past it.
    const away=f.jukeT>0 ? f.jukeAngle
                         : Math.atan2(dy,dx)+Math.sin(t*2.6+f.seed)*.5;
    dvx+=Math.cos(away)*sp;
    dvy+=Math.sin(away)*sp*.55;
  }else if(f.state==="cruise"){
    dvx+=Math.cos(f.heading)*f.speed;
    dvy+=Math.sin(f.heading)*f.speed*.32;
  }else{
    // Lounging: hovering in place with a lazy sway.
    dvx+=Math.sin(t*.33+f.seed)*2.4;
    dvy+=Math.cos(t*.27+f.seed*1.4)*1.5;
  }

  // Light schooling + separation, only while calm. Cohesion is deliberately
  // weak: a tight blob guarantees a shark is always sitting inside the school.
  if(f.state!=="flee"){
    let cxs=0,cys=0,count=0,sepX=0,sepY=0;
    for(const o of fishes){
      if(o===f)continue;
      const dx=cx(o)-cx(f),dy=cy(o)-cy(f),d2v=dx*dx+dy*dy;
      if(d2v<130*130){
        cxs+=cx(o);cys+=cy(o);count++;
        if(d2v<52*52&&d2v>1){
          const d=Math.sqrt(d2v);
          sepX-=dx/d*(52-d)/52;
          sepY-=dy/d*(52-d)/52;
        }
      }
    }
    if(count){
      dvx+=(cxs/count-cx(f))*.008+sepX*30;
      dvy+=(cys/count-cy(f))*.008+sepY*30;
    }
  }

  // Personal space around every shark, at all times. A resting shark should
  // part the school as it drifts through, not send it into a panic — without
  // this the two populations sit permanently on top of one another.
  for(const s of sharks){
    if(s===threat)continue;
    const dx=cx(f)-cx(s),dy=cy(f)-cy(s),d=Math.hypot(dx,dy)||1;
    if(d<125){const q=(125-d)/125; dvx+=dx/d*36*q; dvy+=dy/d*21*q}
  }

  // ---- edges: turn back near the glass, measured from the sprite's own
  // trailing edge so the tank is used right out to the walls ----
  const M=44, myT=TOP()+22, myB=BOTTOM()-22-f.h;
  if(f.x<M)          dvx+=(M-f.x)*1.1;
  if(f.x+f.w>W-M)    dvx-=(f.x+f.w-(W-M))*1.1;
  if(f.y<myT)        dvy+=(myT-f.y)*1.3;
  if(f.y>myB)        dvy-=(f.y-myB)*1.3;

  // Smooth toward the desired velocity.
  const agility=f.state==="flee"?9.5:2.2;
  f.vx=lerp(f.vx,dvx,Math.min(1,agility*dt));
  f.vy=lerp(f.vy,dvy,Math.min(1,agility*dt));

  const cap=f.state==="flee"?f.fleeSpeed*(f.dash>0?1.3:1):26;
  const sp=Math.hypot(f.vx,f.vy)||1;
  if(sp>cap){f.vx=f.vx/sp*cap;f.vy=f.vy/sp*cap}

  f.x+=f.vx*dt; f.y+=f.vy*dt;
  confine(f);

  // Facing only flips on real movement — at lounging speeds an unguarded
  // sign test makes the sprite strobe left/right every frame.
  if(Math.abs(f.vx)>3.5) f.face=f.vx>0?1:-1;
}

/* ---- Sharks -------------------------------------------------------------- */
const sharkColors=[palette.adult,palette.pink,palette.orange,palette.green,palette.baby];
function spawnShark(i){
  const s={
    artLines:SHARK_RIGHT,
    x:W*(.16+i*.17),y:H*(.30+(i%2)*.18),
    vx:0,vy:0, face:1,
    color:sharkColors[i],phase:rnd(0,6.28),
    size:i<2?1.42:(i<4?1.58:1.72),
    scale:0,
    target:null, state:"cruise", stateT:rnd(1,5), cool:0,
    heading:rnd(-Math.PI,Math.PI), speed:rnd(18,26),
    lunge:0, bob:0, flash:0, seed:rnd(0,100),
    // Hunt legibility
    spd:0,                    // scalar speed, steered separately from heading
    burst:0,                  // hard acceleration window right after lock-on
    alert:0,                  // "!" above the shark at the moment it locks on
    puffed:false, puffed2:false, missed:0,  // close-approach puffs + miss recovery
    trail:[], tdist:1e9,      // ASCII motion trail while charging
    reaction:rnd(.14,.30)     // how far behind the fish this shark aims
  };
  s.scale=s.size*1.08;
  measure(s);
  return s;
}

const HUNT_SPEED=52, LUNGE_SPEED=88, STRIKE_DIST=20, LUNGE_DIST=130;
// At most two of the family hunt at once. Five simultaneous hunters turns the
// tank into a permanent chase and nothing ever gets to rest.
const MAX_HUNTERS=2;
const hunting=()=>sharks.reduce((n,s)=>n+(s.state==="hunt"?1:0),0);

// The single most readable moment of the whole aquarium: the instant a shark
// picks a fish. Both animals react visibly and simultaneously.
function lockOn(s,f){
  s.target=f; s.state="hunt"; s.stateT=rnd(5,9);
  s.burst=.7; s.alert=.55; s.puffed=false; s.trail.length=0;
  s.heading=Math.atan2(cy(f)-cy(s),cx(f)-cx(s));
  addBubble(cx(s),cy(s),4);

  // The fish doesn't ease into fleeing — it snaps onto a new heading on the
  // same frame, at speed, angled off the shark's line so the charge overshoots.
  const away=Math.atan2(cy(f)-cy(s),cx(f)-cx(s))
           + rnd(.45,1.0)*(Math.random()<.5?-1:1);
  const sp=f.fleeSpeed*1.3;
  f.vx=Math.cos(away)*sp;
  f.vy=Math.sin(away)*sp*.6;
  f.state="flee"; f.stateT=rnd(1.5,2.6);
  f.fear=1; f.alert=.55; f.dash=.8; f.trail.length=0;
}

function updateShark(s,idx,dt){
  s.phase+=dt;
  s.stateT-=dt;
  s.cool=Math.max(0,s.cool-dt);
  s.flash=Math.max(0,s.flash-dt*1.6);
  s.lunge=Math.max(0,s.lunge-dt);
  s.burst=Math.max(0,s.burst-dt);
  s.missed=Math.max(0,s.missed-dt);
  s.alert=Math.max(0,s.alert-dt);

  // Motion trail while charging, trimmed back once it settles.
  if(s.state==="hunt"&&(s.burst>0||s.lunge>0)){
    // Emit from the TAIL, not the centre — a shark is ~120px long, so
    // centre-emitted marks land inside its own body and read as glyph soup.
    s.trail.push({x:cx(s)-s.face*s.w*.62,y:cy(s)});
    if(s.trail.length>10) s.trail.shift();
  }else if(s.trail.length&&Math.random()<dt*20) s.trail.shift();

  // Drop a target that has become stale or unreachable.
  if(s.target&&distC(s,s.target)>Math.max(W,H)*.75) s.target=null;
  if(s.state==="hunt"&&!s.target){ s.state="cruise"; s.stateT=rnd(2,5); s.cool=rnd(4,9); }

  // A resting shark can still be startled into a hunt by a fish drifting right
  // past its nose — but only occasionally, or it never stops hunting.
  if(s.state!=="hunt"&&s.cool<=0&&hunting()<MAX_HUNTERS&&Math.random()<dt*.8){
    for(const f of fishes){
      if(distC(s,f)<90){ lockOn(s,f); break; }
    }
  }

  // Acquire a target when the current behaviour expires.
  if(s.stateT<=0){
    if(s.state==="hunt"){
      // Every hunt is followed by a real rest, however it ended.
      s.target=null; s.state="lounge"; s.stateT=rnd(3,7); s.cool=rnd(4,9);
    }else if(s.cool<=0&&hunting()<MAX_HUNTERS&&Math.random()<.7){
      let best=null,bd=Infinity;
      for(const f of fishes){
        // Correct distance call. The old dist2(s,f) passed two objects into a
        // four-scalar function, returned NaN, and silently never picked a fish.
        let d=distC(s,f);
        // Spread the pack out: discourage piling onto one fish.
        let taken=0;
        for(const o of sharks) if(o!==s&&o.target===f) taken++;
        d+=taken*260;
        if(d<bd){bd=d;best=f}
      }
      if(best&&bd<Math.max(W,H)*.8){
        lockOn(s,best);
      }else{
        s.state=Math.random()<.5?"lounge":"cruise"; s.stateT=rnd(3,7);
      }
    }else{
      s.state=s.state==="lounge"?"cruise":"lounge";
      s.stateT=s.state==="cruise"?rnd(4,9):rnd(3,7);
      s.heading=rnd(-Math.PI,Math.PI);
      s.speed=rnd(18,26);
    }
  }

  // ---- desired velocity, by state ----
  let dvx=current.x,dvy=current.y,cap=26;

  if(s.state==="hunt"&&s.target){
    const f=s.target;
    const dx=cx(f)-cx(s),dy=cy(f)-cy(s),d=Math.hypot(dx,dy)||1;

    s.tdist=d;
    if(d<LUNGE_DIST&&s.missed<=0) s.lunge=Math.max(s.lunge,.55);

    // Sailed straight past it. Detected as the shark's own velocity turning
    // away from the fish at close range — that is literally what a miss is.
    if(s.lunge>0&&s.missed<=0&&d<115&&(dx*s.vx+dy*s.vy)<0){
      s.missed=.85; s.lunge=0; addBubble(cx(s),cy(s),5);
    }

    const speed=s.missed>0 ? HUNT_SPEED*.5
              : (s.lunge>0||s.burst>0) ? LUNGE_SPEED : HUNT_SPEED;

    // Two puffs on the way in: one entering lunge range, one right on top of
    // the fish. Both re-arm once the gap opens again.
    if(d<LUNGE_DIST&&!s.puffed){ s.puffed=true; addBubble(cx(s),cy(s),6); }
    if(d<58&&!s.puffed2){ s.puffed2=true; addBubble(cx(s),cy(s),8); }
    if(d>LUNGE_DIST*1.6){ s.puffed=false; }
    if(d>110){ s.puffed2=false; }

    // Aim at where the fish WAS, s.reaction seconds ago. Chasing the live
    // position tracks perfectly and reads as a homing missile; chasing a stale
    // position means a hard juke leaves the shark charging at empty water.
    let aimX=cx(f),aimY=cy(f);
    for(let i=f.hist.length-1;i>=0;i--){
      if(t-f.hist[i].t>=s.reaction){ aimX=f.hist[i].x; aimY=f.hist[i].y; break; }
    }
    const ax=aimX-cx(s), ay=aimY-cy(s), ad=Math.hypot(ax,ay)||1;
    dvx+=ax/ad*speed;
    dvy+=ay/ad*speed*.7;
    cap=speed;

    if(d<STRIKE_DIST&&s.missed<=0){
      // Near-miss strike: the fish bolts, the shark is satisfied and rests.
      addBubble(cx(s),cy(s),14);
      f.dash=.8; f.alert=.5;
      const bx=cx(f)-cx(s),by=cy(f)-cy(s),bd2=Math.hypot(bx,by)||1;
      f.vx=bx/bd2*f.fleeSpeed*1.35;
      f.vy=by/bd2*f.fleeSpeed*.9;
      f.state="flee"; f.stateT=rnd(1.4,2.4); f.fear=1;
      s.target=null; s.state="lounge"; s.stateT=rnd(3,6);
      s.cool=rnd(4,8); s.flash=1; s.lunge=0;
    }
  }else if(s.state==="cruise"){
    dvx+=Math.cos(s.heading)*s.speed;
    dvy+=Math.sin(s.heading)*s.speed*.3;
    cap=s.speed;
  }else{
    // Lounging: hanging in the water, barely moving.
    dvx+=Math.sin(t*.24+s.seed)*3.2;
    dvy+=Math.cos(t*.19+s.seed*1.3)*2.0;
    cap=9;
  }

  // Keep the family from stacking up.
  for(const o of sharks){
    if(o===s)continue;
    const dx=cx(s)-cx(o),dy=cy(s)-cy(o),d=Math.hypot(dx,dy)||1;
    const near=(s.w+o.w)*.55+90;
    if(d<near){
      const q=(near-d)/near;
      dvx+=dx/d*46*q;
      dvy+=dy/d*26*q;
    }
  }

  const M=50, myT=TOP()+16, myB=BOTTOM()-30-s.h;
  if(s.x<M)          dvx+=(M-s.x)*1.0;
  if(s.x+s.w>W-M)    dvx-=(s.x+s.w-(W-M))*1.0;
  if(s.y<myT)        dvy+=(myT-s.y)*1.2;
  if(s.y>myB)        dvy-=(s.y-myB)*1.2;

  if(s.state==="hunt"){
    // Steer heading and speed separately, with a capped turn rate. A shark
    // travelling at 88px/s simply cannot corner tightly, so a fish that jukes
    // makes it sail past and bank around — the overshoot is physical, not faked.
    const want=Math.atan2(dvy,dvx);
    let diff=((want-s.heading+Math.PI*3)%(Math.PI*2))-Math.PI;
    // Inside the last stretch a strike is ballistic: the shark picks its line
    // and rides it in, unable to correct. That commitment is what a juking fish
    // beats — and what makes the overshoot read as a real miss rather than a
    // steering glitch. After a miss it slows and banks around hard to re-line.
    const committed=s.lunge>0&&s.tdist<90;
    const maxTurn=(s.missed>0?3.6
                 :committed?0.4
                 :(s.lunge>0||s.burst>0)?1.7:2.9)*dt;
    s.heading+=clamp(diff,-maxTurn,maxTurn);
    // Acceleration is sharp on lock-on, ordinary otherwise — that snap is what
    // tells the viewer the hunt just started.
    s.spd=lerp(s.spd,cap,Math.min(1,(s.burst>0?10:3.2)*dt));
    s.vx=Math.cos(s.heading)*s.spd;
    s.vy=Math.sin(s.heading)*s.spd*.8;
  }else{
    s.vx=lerp(s.vx,dvx,Math.min(1,1.8*dt));
    s.vy=lerp(s.vy,dvy,Math.min(1,1.8*dt));
    const sp=Math.hypot(s.vx,s.vy)||1;
    const hardCap=Math.max(cap,12);
    if(sp>hardCap){s.vx=s.vx/sp*hardCap;s.vy=s.vy/sp*hardCap}
    // Keep heading and speed live so entering a hunt starts from real motion.
    s.heading=Math.atan2(s.vy,s.vx);
    s.spd=sp;
  }

  s.x+=s.vx*dt; s.y+=s.vy*dt;
  confine(s);

  if(Math.abs(s.vx)>3.5) s.face=s.vx>0?1:-1;

  if(beatPulse>.82){ s.bob=1; }
  s.bob=lerp(s.bob,0,Math.min(1,dt*5));

  // Hunting sharks stream bubbles; resting ones barely breathe.
  const rate=s.state==="hunt"?.9:.10;
  if(Math.random()<dt*(rate+audioLevel*.14))
    addBubble(s.x+(s.face>0?s.w*.9:s.w*.1),cy(s),1);
}

/* ---- Creatures ----------------------------------------------------------- */
function spawnCreature(i){
  const types=["crab","jelly","turtle","seahorse","starfish","ray"];
  const type=types[i%types.length];
  const B=CREATURE_BEHAVIOR[type];
  const c={
    type, artLines:CREATURE_ART[type],
    x:rnd(W*.08,W*.88),
    y:B.floor?rnd(H*.70,H*.84):rnd(H*.20,H*.70),
    vx:0,vy:0, face:Math.random()<.5?1:-1,
    phase:rnd(0,Math.PI*2), seed:rnd(0,100),
    scale:rnd(.86,1.12),
    floor:!!B.floor,
    state:"lounge", stateT:rnd(1,B.lounge[1]),
    heading:rnd(-Math.PI,Math.PI),
    speed:rnd(B.speed[0],B.speed[1])
  };
  measure(c);
  confine(c);
  return c;
}

function updateCreature(c,dt){
  const B=CREATURE_BEHAVIOR[c.type];
  c.phase+=dt*(.5+(c.state==="cruise"?.5:0));
  c.stateT-=dt;

  if(c.stateT<=0){
    if(c.state==="cruise"){
      c.state="lounge"; c.stateT=rnd(B.lounge[0],B.lounge[1]);
    }else{
      c.state="cruise"; c.stateT=rnd(B.cruise[0],B.cruise[1]);
      // Floor dwellers only ever commit to left or right.
      c.heading=c.floor?(Math.random()<.5?0:Math.PI):rnd(-Math.PI,Math.PI);
      c.speed=rnd(B.speed[0],B.speed[1]);
    }
  }

  let dvx=current.x*.6,dvy=current.y*.6;
  if(c.state==="cruise"){
    dvx+=Math.cos(c.heading)*c.speed;
    dvy+=Math.sin(c.heading)*c.speed*B.vy;
  }else{
    // Lounging: settled, with just enough sway to look alive.
    dvx+=Math.sin(t*.21+c.seed)*1.6;
    dvy+=Math.cos(t*.17+c.seed*1.6)*(c.floor?.4:1.1);
  }

  // Creatures give each other room too.
  for(const o of creatures){
    if(o===c)continue;
    const dx=cx(c)-cx(o),dy=cy(c)-cy(o),d=Math.hypot(dx,dy)||1;
    const near=(c.w+o.w)*.5+22;
    if(d<near){const q=(near-d)/near; dvx+=dx/d*20*q; dvy+=dy/d*10*q}
  }

  const M=36;
  if(c.x<M)          dvx+=(M-c.x)*.9;
  if(c.x+c.w>W-M)    dvx-=(c.x+c.w-(W-M))*.9;
  if(!c.floor){
    const myT=TOP()+14, myB=BOTTOM()-20-c.h;
    if(c.y<myT) dvy+=(myT-c.y)*1.1;
    if(c.y>myB) dvy-=(c.y-myB)*1.1;
  }

  c.vx=lerp(c.vx,dvx,Math.min(1,1.5*dt));
  c.vy=lerp(c.vy,dvy,Math.min(1,1.5*dt));

  const cap=c.state==="cruise"?c.speed:4;
  const sp=Math.hypot(c.vx,c.vy)||1;
  if(sp>cap){c.vx=c.vx/sp*cap;c.vy=c.vy/sp*cap}

  c.x+=c.vx*dt; c.y+=c.vy*dt;
  confine(c);

  if(Math.abs(c.vx)>2.2) c.face=c.vx>0?1:-1;

  if(c.type==="jelly"&&c.state==="cruise"&&Math.random()<dt*.35)
    addBubble(cx(c),c.y+c.h,1);
}

/* ---- Bubbles, plankton, weeds -------------------------------------------- */
function addBubble(x,y,n=1){
  for(let i=0;i<n;i++)bubbles.push({
    x:clamp(x+rnd(-7,7),2,W-2),y:y+rnd(-3,5),
    r:rnd(2,5),vy:rnd(9,20),phase:rnd(0,6.28),life:rnd(4,8)
  });
}

// resize() must run FIRST: it establishes W, H, BASE and CHARW. Spawning
// before it placed every creature at x=0,y=0, which confine() then stacked
// into the top-left corner of the tank.
addEventListener("resize",resize);
resize();

for(let i=0;i<5;i++)sharks.push(spawnShark(i));
for(let i=0;i<9;i++)creatures.push(spawnCreature(i));
for(let i=0;i<65;i++)particles.push({
  x:rnd(0,W),y:rnd(H*.06,H*.9),
  a:rnd(.04,.22),phase:rnd(0,6.28),speed:rnd(.5,2)
});
for(let i=0;i<12;i++)weeds.push({
  x:0,jitter:rnd(-18,18),h:rnd(35,110),phase:rnd(0,6.28),w:rnd(5,12)
});
for(let i=0;i<85;i++)bubbles.push({
  x:rnd(0,W),y:rnd(H*.08,H*.94),
  r:rnd(1.5,4.2),vy:rnd(4,13),phase:rnd(0,6.28),life:rnd(3,9)
});

resize();   // second pass: lays out the weeds now that they exist
for(const c of creatures) if(Math.random()<.8) addBubble(cx(c),cy(c),1);

/* ---- Drawing ------------------------------------------------------------- */
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#020b0d");
  g.addColorStop(.55,"#031214");
  g.addColorStop(1,"#02100f");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const glow=ctx.createRadialGradient(W*.52,H*.42,10,W*.52,H*.42,Math.max(W,H)*.62);
  glow.addColorStop(0,"rgba(23,91,83,.12)");
  glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  ctx.font=`${Math.max(9,Math.round(CHARW*.7))}px monospace`;
  ctx.fillStyle=palette.plankton;
  for(const p of particles){
    const x=p.x+Math.sin(t*p.speed+p.phase)*5+current.x*.4;
    const y=p.y+Math.cos(t*p.speed*.6+p.phase)*3;
    ctx.globalAlpha=p.a*(.75+audioLevel*.5);
    ctx.fillText(p.phase>3?"·":".",x,y);
  }
  ctx.globalAlpha=1;

  ctx.strokeStyle="rgba(57,224,199,.10)";
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<=W;x+=12){
    const y=H*.065+Math.sin(x*.012+t*.35)*2;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();

  ctx.fillStyle="rgba(4,31,29,.52)";
  ctx.fillRect(0,H*.91,W,H*.09);

  for(const w of weeds){
    const base=H*.92;
    ctx.strokeStyle=palette.weed;ctx.globalAlpha=.28;ctx.lineWidth=1;
    for(let j=0;j<3;j++){
      const bx=w.x+j*4-4;
      ctx.beginPath();ctx.moveTo(bx,base);
      for(let k=1;k<7;k++){
        const yy=base-w.h*k/6;
        const xx=bx+Math.sin(t*.55+w.phase+k*.7)*w.w*(k/6);
        ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

function drawBubbles(dt){
  if(bubbles.length>140) bubbles.splice(0,bubbles.length-140);
  if(Math.random()<.12) addBubble(rnd(0,W),H*.93,1);

  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.y-=b.vy*dt;
    b.x+=Math.sin(t*.8+b.phase)*.15+current.x*dt*.5;
    b.life-=dt;
    if(b.y<-10||b.life<=0){bubbles.splice(i,1);continue}
    ctx.globalAlpha=Math.min(.68,b.life*.18);
    ctx.strokeStyle=palette.bubble;ctx.lineWidth=b.r>2.8?1.1:.8;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// Wake left by anything moving fast — oldest marks are the faintest and the
// smallest, so the trail reads as a direction of travel.
const TRAIL_CH=["=","=","-","-","·","·"];
function drawTrail(trail,color,strength){
  const n=trail.length;
  for(let i=0;i<n;i++){
    const age=1-(i+1)/n;                       // 0 = newest
    const ch=TRAIL_CH[Math.min(TRAIL_CH.length-1,Math.floor(age*TRAIL_CH.length))];
    drawTextSprite(trail[i].x-CHARW*.5,trail[i].y-BASE*.5,[ch],color,(1-age)*strength,.85);
  }
}
function drawTrails(){
  for(const s of sharks) if(s.trail.length) drawTrail(s.trail,s.color,.62);
  for(const f of fishes) if(f.trail.length) drawTrail(f.trail,f.color,.34);
}

// The lock-on tell. "!" over the hunter, "!!!" over the fish it just picked.
function drawAlerts(){
  for(const f of fishes){
    if(f.alert<=0)continue;
    const a=Math.min(1,f.alert*2.4);
    drawTextSprite(cx(f)-CHARW*1.5,f.y-BASE*1.7,["!!!"],"#fff3b0",a,.95);
  }
  for(const s of sharks){
    if(s.alert<=0)continue;
    const a=Math.min(1,s.alert*2.4);
    drawTextSprite(cx(s)-CHARW*.5,s.y-BASE*1.9,["!"],s.color,a,1.15);
  }
}

function drawCreature(c){
  const lines=c.face<0?mirror(c.artLines):c.artLines;
  const bob=Math.sin(c.phase*1.5)*(c.state==="lounge"?1.0:1.6);
  drawTextSprite(c.x,c.y+bob,lines,CREATURE_COLORS[c.type],.92,c.scale);
}

function drawFish(f){
  const s=f.face>0?FISH[f.artIndex]:FISH_MIRRORED[f.artIndex];
  const bob=Math.sin(f.phase*1.7)*(f.state==="lounge"?1.1:1.7);
  drawTextSprite(f.x,f.y+bob,[s],f.color,.72+f.fear*.2,f.size);
}

function drawShark(s,idx){
  const frame=s.face>0?SHARK_RIGHT:SHARK_LEFT;
  const bob=Math.sin(s.phase*1.8+idx)*(s.state==="lounge"?1.2:2.0)+s.bob*4.0;
  const beatWiggle=beatPulse>0?Math.sin(beatPulse*Math.PI*2)*1.5:0;
  const alpha=.9+s.flash*.08;
  const bodySize=BASE*s.scale;

  drawTextSprite(s.x+beatWiggle,s.y+bob,frame,s.color,alpha,s.scale);

  ctx.save();
  const finSize=bodySize*1.55;
  ctx.font=`${Math.round(finSize)}px "Noto Sans Symbols 2","Segoe UI Symbol","Arial Unicode MS",sans-serif`;
  ctx.textBaseline="alphabetic";
  const finWidth=ctx.measureText(SHARK_FIN).width;
  const finX=s.x+beatWiggle+s.w*.42-finWidth/2;
  const finY=s.y+bob-bodySize*.72;
  ctx.globalAlpha=alpha*.96;
  ctx.fillStyle=s.color;
  ctx.fillText(SHARK_FIN,finX,finY);
  ctx.restore();
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;

  analyseAudio();
  beatPulse=Math.max(0,beatPulse-dt*2.8);

  current.x=Math.sin(t*.07)*2.2+Math.sin(t*.031)*1.3;
  current.y=Math.cos(t*.05)*.85;

  drawBackground();
  for(const f of fishes)updateFish(f,dt);
  for(let i=0;i<sharks.length;i++)updateShark(sharks[i],i,dt);
  for(const c of creatures)updateCreature(c,dt);

  drawBubbles(dt);
  drawTrails();
  for(const c of creatures)drawCreature(c);
  for(const f of fishes)drawFish(f);
  for(let i=0;i<sharks.length;i++)drawShark(sharks[i],i);
  drawAlerts();

  if(beatPulse>.85){
    ctx.fillStyle="rgba(70,240,210,.012)";
    ctx.fillRect(0,0,W,H);
  }
}
requestAnimationFrame(frame);

})();

window.addEventListener("error",(ev)=>{
  console.error("Aquarium error:",ev.error||ev.message);
});
</script>
</body>
